<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogicPuzzleX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hero">
    <section>
      <p class="eyebrow">CSE 440 · Artificial Intelligence</p>
      <h1>Logic<span>Puzzle</span>X</h1>

      <p class="status" id="status"><span class="dot"></span><span id="status-text">Checking solver API…</span></p>
    </section>
    <section class="panel">
      <div class="board" id="board" aria-label="Sudoku preview"></div>
      <p class="caption">Arto Inkala's 2012 puzzle. The live solver arrives in Phase 1.</p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>

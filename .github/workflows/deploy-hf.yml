name: deploy to Hugging Face

# Pushes the app to a Hugging Face Docker Space on every push to main.
# One-time setup (see README, "Deploy"):
#   - repository secret  HF_TOKEN  = a Hugging Face access token with write access
#   - repository variable HF_SPACE = <hf-username>/<space-name>, e.g. rayedriasat/logicpuzzlex
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@v5
      - name: Build the Space contents
        # Only text files: the Hub rejects plain-git pushes of binaries, and the app does not need them.
        run: |
          mkdir space
          cp -r Dockerfile .dockerignore requirements.txt main.py support data space/
          cp deploy/huggingface/README.md space/README.md
          rm -rf space/support/tests
          find space -name '__pycache__' -prune -exec rm -rf {} +
          find space -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.pdf' -o -name '*.mp4' -o -name '*.pptx' \) -delete
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
